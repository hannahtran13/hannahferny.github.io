<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8e0cf">
    <meta
      name="description"
      content="Everything I carried in July — an interactive personal inventory."
    >
    <title>Everything I Carried in July</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header class="masthead">
        <p class="eyebrow">A personal inventory · July 2026</p>
        <h1>everything i carried<br>in July</h1>
        <div class="intro">
          <p>Some burdens become prettier when you give them a shape.</p>
          <p class="instruction">
            Drag the objects to rearrange the month. Tap one to see what it held.
          </p>
        </div>
      </header>

      <section class="table" aria-label="Interactive tray of July objects">
        <div class="tray">
          <img class="tray-image" src="assets/tray.png" alt="" draggable="false">
        </div>
        <div class="tray-caption" aria-hidden="true">
          <span>01—31</span>
          <span>Handle with care</span>
        </div>
      </section>

      <footer>
        <p>Nothing here was as fragile as it looked.</p>
        <button class="reset" type="button">Put everything back</button>
      </footer>
    </main>

    <div class="modal-wrap" hidden>
      <article
        class="note-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="note-title"
      >
        <button class="close" type="button" aria-label="Close note">×</button>
        <p class="note-number"></p>
        <img class="note-image" src="" alt="">
        <p class="note-label">It carried</p>
        <h2 id="note-title"></h2>
        <p class="note-text"></p>
      </article>
    </div>
  </body>
</html>
